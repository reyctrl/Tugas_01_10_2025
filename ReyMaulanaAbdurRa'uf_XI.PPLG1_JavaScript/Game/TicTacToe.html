<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Tic Tac Toe</title>
<style>
    body {
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        background: #f2f2f2;
    }
    .game {
        text-align: center;
    }
    h1 {
        margin-bottom: 20px;
    }
    .board {
        display: grid;
        grid-template-columns: repeat(3, 100px);
        grid-template-rows: repeat(3, 100px);
        gap: 5px;
        margin: auto;
    }
    .cell {
        width: 100px;
        height: 100px;
        border-radius: 5px;
        background: #fff;
        border: 1px solid #333;
        font-size: 36px;
        font-weight: bold;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
    }
    .cell:hover {
        background: #e0e0e0;
    }
    .status {
        margin-top: 20px;
        font-size: 18px;
        font-weight: bold;
    }
    button {
        margin-top: 15px;
        padding: 10px 15px;
        font-size: 16px;
        cursor: pointer;
    }
</style>
</head>
<body>
<div class="game">
    <h1>Tic Tac Toe</h1>
    <div class="board" id="board"></div>
    <div class="status" id="status">Giliran: X</div>
    <button onclick="resetGame()">Reset Game</button>
</div>

<script>
    const board = document.getElementById("board");
    const statusText = document.getElementById("status");
    let cells = [];
    let currentPlayer = "X";
    let gameOver = false;

    function createBoard() {
        board.innerHTML = "";
        cells = [];
        for (let i = 0; i < 9; i++) {
            const cell = document.createElement("div");
            cell.classList.add("cell");
            cell.addEventListener("click", () => makeMove(cell, i));
            board.appendChild(cell);
            cells.push(cell);
        }
    }

    function makeMove(cell, index) {
        if (cell.textContent !== "" || gameOver) return;
        cell.textContent = currentPlayer;

        if (checkWin()) {
            statusText.textContent = "🎉 Pemain " + currentPlayer + " menang!";
            gameOver = true;
            return;
        }

        if (cells.every(c => c.textContent !== "")) {
            statusText.textContent = "🤝 Seri!";
            gameOver = true;
            return;
        }

        currentPlayer = currentPlayer === "X" ? "O" : "X";
        statusText.textContent = "Giliran: " + currentPlayer;
    }

    function checkWin() {
        const winPatterns = [
            [0,1,2], [3,4,5], [6,7,8], // baris
            [0,3,6], [1,4,7], [2,5,8], // kolom
            [0,4,8], [2,4,6]           // diagonal
        ];
        return winPatterns.some(pattern => {
            return pattern.every(index => cells[index].textContent === currentPlayer);
        });
    }

    function resetGame() {
        currentPlayer = "X";
        gameOver = false;
        statusText.textContent = "Giliran: " + currentPlayer;
        createBoard();
    }

    // Inisialisasi
    createBoard();
</script>
</body>
</html>
